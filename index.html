<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WetterApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section id="home">
            <div class="logo">⛅</div>
            <h1>Wetter<span>App</span></h1>
            <p class="subtitle">Finde das aktuelle Wetter und die Vorhersage für deine Stadt</p>

            <form id="search-form">
                <input id="city-input" type="text" placeholder="Stadt eingeben..." autocomplete="off" required>
                <button type="submit">Wetter anzeigen</button>
            </form>
            <p id="error-message" class="error hidden"></p>
            <div class="quick-cities">
                <button type="button" class="chip">Wolfsburg</button>
                <button type="button" class="chip">Berlin</button>
                <button type="button" class="chip">München</button>
                <button type="button" class="chip">Hamburg</button>
                <button type="button" class="chip">Wien</button>
            </div>
        </section>

        <section id="forecast" class="hidden">
            <header class="view-header">
                <button type="button" id="back-home" class="back-btn" aria-label="Zurück zur Suche">←</button>
                <div>
                    <h2 id="forecast-city"></h2>
                    <p class="view-sub">7-Tage-Vorhersage</p>
                </div>
            </header>
            <ul id="day-list" class="day-list"></ul>
        </section>
        <section id="detail" class="hidden">
            <header class="view-header">
                <button type="button" id="back-forecast" class="back-btn" aria-label="Zurück zur Übersicht">←</button>
                <div>
                    <h2 id="detail-day"></h2>
                    <p class="view-sub" id="detail-sub"></p>
                </div>
            </header>

            <div class="card">
                <img class="detail-icon" id="detail-icon" alt="">
                <p class="detail-text" id="detail-text"></p>
                <p class="detail-temp" id="detail-temp"></p>
                <p class="detail-label" id="detail-label"></p>
                <div class="stats">
                    <div class="stat"><span>Gefühlt</span><strong id="detail-feels"></strong></div>
                    <div class="stat"><span>Min</span><strong id="detail-min"></strong></div>
                    <div class="stat"><span>Max</span><strong id="detail-max"></strong></div>
                </div>
            </div>

            <div class="card">
                <h3>Stündliche Vorhersage</h3>
                <ul id="hour-list" class="hour-list"></ul>
            </div>
        </section>
    </main>
    <script src="js/weather-codes.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
